version: '3.9'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: agutierrezl-oracle
    environment:
      ORACLE_PASSWORD: agutierrezl
      ORACLE_DATABASE: book_tracker_db
      ORACLE_USER: agutierrezl
      ORACLE_PASSWORD_BOOK_TRACKER: agutierrezl
    ports:
      - 1522:1521
      - 5501:5500
    networks:
      - agutierrezl

  oracle-adminer:
    image: adminer
    container_name: agutierrezl-oracle-adminer
    ports:
      - 8081:8080
    environment:
      ADMINER_DEFAULT_SERVER: oracle-db
    networks:
      - agutierrezl

networks:
  agutierrezl:
    name: agutierrezl-network
